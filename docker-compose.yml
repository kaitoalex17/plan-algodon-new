version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cto-tracker-fase3-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cto_admin_fase3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin_cto_secure_2024_fase3}
      POSTGRES_DB: ${POSTGRES_DB:-cto_tracker_fase3}
    ports:
      - "5452:5432"
    volumes:
      - cto_pgdata_fase3:/var/lib/postgresql/data

  app:
    build: .
    container_name: cto-tracker-fase3-app
    restart: unless-stopped
    ports:
      - "3020:3020"
    environment:
      - PORT=3020
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cto_admin_fase3}:${POSTGRES_PASSWORD:-admin_cto_secure_2024_fase3}@db:5432/${POSTGRES_DB:-cto_tracker_fase3}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-esta_es_una_clave_secreta_para_nextauth_7_dias_fase3}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3020}
    volumes:
      - cto_uploads_fase3:/app/public/uploads # Volumen para persistir las imágenes subidas
    depends_on:
      - db

  # SERVIDOR SFTP DIRECTO A LA CARPETA DE UPLOADS (CONFIGURABLE)
  sftp:
    image: atmoz/sftp:latest
    container_name: cto-tracker-fase3-sftp
    restart: unless-stopped
    ports:
      - "${SFTP_PORT:-2222}:22"
    command: ${SFTP_USER:-sftpuser}:${SFTP_PASSWORD:-sftppassword123}:1001::upload
    volumes:
      - cto_uploads_fase3:/home/${SFTP_USER:-sftpuser}/upload

volumes:
  cto_pgdata_fase3:
    name: cto_pgdata_fase3
  cto_uploads_fase3:
    name: cto_uploads_fase3
